name: Build BakaSU kernel (mars)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # LineageOS 23.2 (Android 16) builds this 5.4 kernel with clang-r563880c
  CLANG_VERSION: clang-r563880c
  CLANG_TAG: refs/tags/android-16.0.0_r4
  KERNEL_IMAGE_NAME: Image

jobs:
  build:
    name: Build kernel + AnyKernel3 zip
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Checkout kernel source (with BakaSU submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch full BakaSU history (needed for the KernelSU version code)
        run: |
          # KSU_VERSION = 30000 + $(git rev-list --count HEAD) + 700, so a shallow
          # submodule clone would report a bogus version (30701 instead of 35213)
          # and the manager would complain that the kernel is too old.
          git -C KernelSU fetch --unshallow --tags origin || git -C KernelSU fetch --tags origin
          git -C KernelSU describe --tags || true
          echo "BakaSU commits: $(git -C KernelSU rev-list --count HEAD)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc libssl-dev libelf-dev libdw-dev cpio rsync zip unzip

      - name: Cache clang prebuilt
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain/${{ env.CLANG_VERSION }}
          key: ${{ runner.os }}-${{ env.CLANG_VERSION }}

      - name: Download AOSP clang ${{ env.CLANG_VERSION }}
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${{ env.CLANG_TAG }}/${{ env.CLANG_VERSION }}.tar.gz"
          mkdir -p "toolchain/${{ env.CLANG_VERSION }}"
          tar xzf /tmp/clang.tar.gz -C "toolchain/${{ env.CLANG_VERSION }}"
          rm -f /tmp/clang.tar.gz

      - name: Build kernel
        run: |
          CLANG_DIR="$PWD/toolchain/${{ env.CLANG_VERSION }}" \
          JOBS="$(nproc)" \
          ./ci/build-kernel.sh

      - name: Package AnyKernel3 zip
        run: ./ci/package-anykernel.sh

      - name: Fetch BakaSU manager APK (best effort)
        continue-on-error: true
        run: |
          # The manager and the kernel must be built from the same KernelSU
          # commit: the manager refuses to work when the kernel's UAPI version
          # differs ("需要更新内核").  Derive the matching release from the
          # pinned submodule instead of hard-coding a version.
          TAG=$(git -C KernelSU describe --tags --abbrev=0)
          CODE=$((30000 + $(git -C KernelSU rev-list --count HEAD) + 700))
          echo "KernelSU $TAG (kernel version code $CODE)"
          for name in "ReSukiSU_${TAG}_${CODE}" "BakaSU_${TAG}_${CODE}"; do
            for abi in arm64-v8a universal; do
              url="https://github.com/Baka-SU/BakaSU/releases/download/${TAG}/${name}-${abi}-release.apk"
              if curl -fsSL --retry 2 -o dist/BakaSU-manager-arm64-v8a.apk "$url"; then
                echo "fetched $url"
                exit 0
              fi
            done
          done
          echo "WARNING: no manager APK release matches $TAG (code $CODE) - the" \
               "app already on the device may report '需要更新内核'"

      - name: Artifact summary
        run: ls -la dist/

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-mars-anykernel3
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: BakaSU-manager-apk
          path: dist/*.apk
          retention-days: 30
